[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scamshield"
version = "1.0.0"
description = "Scam detection for WhatsApp conversations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["scam-detection", "whatsapp", "nlp", "fraud", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "anyio>=4.0"]

[project.scripts]
scamshield-serve = "scamshield.__main__:main"
scamshield-train = "scamshield.ml.train:main"
scamshield-fetch-data = "scamshield.ml.datasets:main"
scamshield-whatsapp-check = "scamshield.integrations.whatsapp.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scamshield = ["resources/*.yaml", "api/static/*"]

[tool.pytest.ini_options]
# Without this, `pytest` only works via `python -m pytest` (which happens to
# put the cwd on sys.path). Being explicit makes every invocation work.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
# anyio backend for the async webhook tests
markers = ["anyio: async test"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
